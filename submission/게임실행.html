<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조달청 타이쿤</title>
<!--
  file://에서 실행하면 ZIP에 포함된 오프라인 게임을 연다.
  웹 주소로 열면 GitHub Pages 게임으로 연결한다.
-->
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1628; color: #efe7d2; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 560px; padding: 24px; line-height: 1.7; }
  a { color: #e0b44c; }
</style>
</head>
<body>
<main>
  <h1>조달청 타이쿤</h1>
  <p>게임 페이지로 이동하는 중입니다. 인터넷 연결이 필요합니다.</p>
  <p>자동으로 열리지 않으면 아래 주소를 누르세요.<br>
     <a id="game-link" href="https://TeamIroum.github.io/tycoon/">https://TeamIroum.github.io/tycoon/</a></p>
</main>
<script>
  var GAME_URL = 'https://TeamIroum.github.io/tycoon/';
  var offlineUrl = new URL('오프라인_실행/index.html', location.href);
  offlineUrl.search = location.search;
  var OFFLINE_GAME_URL = offlineUrl.href;
  location.replace(location.protocol === 'file:' ? OFFLINE_GAME_URL : GAME_URL);
</script>
</body>
</html>
